# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-088-24 Router Administation - Concurrency (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# a router administration panel (Flask, MySQL) whose admin pages check authentication and authorization.
# The benchmark folder benchmarks/XBEN-088-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/toctou-admin-router/app/, built by its own Dockerfiles; the overlay in build/toctou-admin-router/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-088-router-administation-concurrency

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.61.131.0/24, internet: false}

machines:
  db:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 1024}
    ports:
      mysql:
        port: 3306
    app:
      build: build/db
  toctou-admin-router:
    networks: {lab: 20}
    resources: {cpus: 1, memory_mb: 512}
    depends_on: [db]
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 80
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/toctou-admin-router

checks:
  - name: the Router Administation - Concurrency page answers
    http: http://toctou-admin-router:80/login
    wait: 180
  - name: a wrong login is refused
    script: checks/probe.sh
    wait: 60

message: |
  Router Administation - Concurrency answers at {{ machines.toctou-admin-router.ports.web.url }}.
  A router admin panel. Its authorization checks may not hold between check and use.
